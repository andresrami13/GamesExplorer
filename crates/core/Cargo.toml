[package]
name = "mis-juegos-core"
description = "Lectura local de bibliotecas de Steam y Epic, caché de imágenes y metadatos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs = "7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# En Windows, TLS del sistema (SChannel): usa el almacén de certificados de Windows
# y no necesita compilador de C. En el resto (desarrollo y tests), rustls.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
winreg = "0.56"

[target.'cfg(not(windows))'.dependencies]
ureq = "3"

[dev-dependencies]
tempfile = "3"
